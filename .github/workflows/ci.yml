name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          export MOON_HOME="$RUNNER_TEMP/moonbit-0.10.16"
          export MOON_TOOLCHAIN_ROOT="$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "MOON_TOOLCHAIN_ROOT=$MOON_TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$MOON_HOME/lib"
          curl --fail --location --retry 3 'https://cli.moonbitlang.com/binaries/0.10.16%2Bb1a0e846e/moonbit-linux-x86_64.tar.gz' -o "$RUNNER_TEMP/moonbit.tar.gz"
          curl --fail --location --retry 3 'https://cli.moonbitlang.com/cores/core-0.10.16%2Bb1a0e846e.tar.gz' -o "$RUNNER_TEMP/core.tar.gz"
          tar xf "$RUNNER_TEMP/moonbit.tar.gz" -C "$MOON_HOME"
          tar xf "$RUNNER_TEMP/core.tar.gz" -C "$MOON_HOME/lib"
          chmod +x "$MOON_HOME"/bin/* "$MOON_HOME/bin/internal/tcc"
          export PATH="$MOON_HOME/bin:$PATH"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          moon version --all
          moonc -v | grep -F 'v0.10.16+b1a0e846e'
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --all
      - name: Check public interface and formatting
        run: |
          moon info
          moon fmt --check
          git diff --exit-code
      - name: Strict check, build, and tests
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
      - name: Run documented workflows
        run: |
          moon run examples/config --target ${{ matrix.target }}
          moon run examples/interchange --target ${{ matrix.target }}
          moon run examples/tooling --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target == 'wasm-gc'
        with:
          python-version: '3.11'
      - name: Reproduce independent differential fixtures
        if: matrix.target == 'wasm-gc'
        run: |
          python -m pip install -r tools/requirements-oracle.txt
          python tools/generate_differential.py --check
